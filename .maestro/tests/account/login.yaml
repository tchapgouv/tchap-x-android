appId: ${MAESTRO_APP_ID}
---
- runFlow:
    when:
      visible: "Bienvenue sur le nouveau Tchap"
    commands:
      - runFlow: ./loginFromClassic.yaml
- runFlow:
    when:
      visible: "Bienvenue dans ${MAESTRO_APP_NAME}"
    commands:
      - runFlow: ./loginFromEmail.yaml
- runFlow:
    when:
      visible: "Bienvenue dans le nouveau Tchap Android"
    commands:
      - tapOn: "Commencer"
- runFlow:
    when:
      visible: "Autorisez les notifications et ne ùanquez aucun message"
    commands:
      - tapOn: "Pas maintenant"
- runFlow: ../assertions/assertHomeDisplayed.yaml
